{{define "title"}}경영 통합 대시보드 · {{appName}}{{end}}
{{define "content"}}
<div class="space-y-6" data-exec-dash data-exec-view="{{.ExecView}}" data-exec-focus="{{.FocusOrg}}">
  <div class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <p class="text-ui-xs text-ink-muted">업무관리시스템 / 경영 통합 대시보드 · 업무</p>
      <div class="mt-1 flex items-center gap-2">
        <h2 class="text-xl font-bold text-ink">경영 통합 대시보드</h2>
        <span class="rounded-full bg-hover px-2 py-0.5 text-xs font-medium text-ink-muted">전사 개요</span>
      </div>
    </div>
    <div class="text-right text-sm text-ink-muted">
      <p>{{.DateLabel}}</p>
      <p>{{.RoleLabel}}</p>
    </div>
  </div>

  <div id="exec-panel">
    {{template "exec_panel" .}}
  </div>
</div>
{{end}}
