{{define "weekly_link_modal"}}
<div id="weekly-link-modal" hidden class="fixed inset-0 z-50 bg-ink/50 flex items-end md:items-center justify-center p-0 md:p-4" data-weekly-link-backdrop>
  <div role="dialog" aria-modal="true" aria-labelledby="weekly-link-title"
       class="w-full md:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-2xl md:rounded-card bg-canvas p-4 shadow-pop">
    <h2 id="weekly-link-title" class="text-ui font-bold text-ink" data-weekly-link-title>사업·활동 연결</h2>
    <ul class="mt-2 text-ui-sm text-ink space-y-1" data-weekly-link-summary></ul>
    <p class="mt-2 text-ui-sm text-ink-muted" data-mnt-skip hidden></p>
    <div class="mt-3 space-y-2" data-project-box>
      <p class="text-ui-sm font-extrabold text-ink">사업</p>
      <input type="search" class="input w-full" placeholder="사업 검색" data-project-filter autocomplete="off">
      <ul class="max-h-48 overflow-y-auto rounded-card border border-line divide-y divide-line" data-project-list>
        {{range $.Projects}}
        {{$foreign := and $.OrgID .OrgID (ne .OrgID $.OrgID)}}
        <li class="px-2 py-1.5 {{if $foreign}}bg-canvas text-ink-muted{{end}}" data-project-row data-name="{{.Name}}" data-start="{{.StartDate}}" data-end="{{.EndDate}}" {{if $foreign}}data-foreign="1"{{end}}>
          <label class="inline-flex items-center gap-2 text-ui-sm w-full">
            <input type="radio" name="project_id" value="{{.ProjectID}}" {{if $foreign}}data-foreign="1"{{end}}>
            {{if $foreign}}<span class="text-ui-xs badge-neutral">타 조직 사업</span>{{end}}
            {{.Name}}
            <span class="text-ui-xs badge-neutral" data-period-match hidden>기간 일치</span>
            <span class="text-ui-xs badge-neutral" data-period-ended hidden>기간 종료</span>
          </label>
        </li>
        {{end}}
      </ul>
      <label class="inline-flex items-center gap-2 text-ui-sm text-ink">
        <input type="checkbox" name="confirm_foreign" value="1" class="rounded" data-confirm-foreign>
        타 조직 사업에 연결합니다
      </label>
    </div>
    <div class="mt-3 space-y-2" data-activity-box>
      <p class="text-ui-sm font-extrabold text-ink">또는 활동 <span class="text-ui-xs font-normal text-ink-muted">(사업에 속하지 않는 업무)</span></p>
      <ul class="grid grid-cols-2 gap-1" data-activity-list>
        {{range activityKinds}}
        <li><label class="inline-flex items-center gap-2 text-ui-sm w-full"><input type="radio" name="activity_kind" value="{{.Key}}" data-activity-radio> {{.Label}}</label></li>
        {{end}}
      </ul>
    </div>
    {{template "weekly_assignee_field" $}}
    <div data-weekly-link-items></div>
    <div class="mt-4 flex justify-end gap-2">
      <button type="button" class="btn-secondary btn-sm" data-weekly-link-close>닫기</button>
      <button type="submit" class="btn-primary btn-sm" data-weekly-link-submit disabled>연결</button>
    </div>
  </div>
</div>
{{end}}
