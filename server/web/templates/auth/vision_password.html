{{define "title"}}비젼관리자 비밀번호 · 고객지원시스템{{end}}
{{define "content"}}
<div class="max-w-xl space-y-6">
  <div>
    <h2 class="text-xl font-bold text-gray-800">비젼관리자 비밀번호</h2>
    <p class="text-sm text-gray-500 mt-1">로그인·AS 수정 비밀번호와 다른 확인 비밀번호입니다. 본인 로그인 상태에서만 바꿉니다.</p>
  </div>
  {{if .MustChange}}
  <div class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-900">환경변수로 초기화했습니다. 새 비밀번호를 정해야 다른 화면을 쓸 수 있습니다.</div>
  {{end}}
  {{if .Error}}
  <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
  {{end}}
  <form method="POST" action="/account/vision-password" class="bg-white rounded-xl border border-gray-200 p-6 space-y-3">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">현재 비젼관리자 비밀번호</label>
      <input type="password" name="current_password" required autocomplete="current-password"
             class="w-full border rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">새 비밀번호</label>
      <input type="password" name="password" required minlength="{{.PasswordMinLen}}" autocomplete="new-password"
             class="w-full border rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">새 비밀번호 확인</label>
      <input type="password" name="password_confirm" required minlength="{{.PasswordMinLen}}" autocomplete="new-password"
             class="w-full border rounded-lg px-3 py-2 text-sm">
    </div>
    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">변경</button>
  </form>
</div>
{{end}}
