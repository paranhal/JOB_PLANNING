{{define "title"}}내 계정 · 고객지원시스템{{end}}
{{define "content"}}
<div class="max-w-xl space-y-6">
  <div>
    <h2 class="text-xl font-bold text-gray-800">내 계정</h2>
    <p class="text-sm text-gray-500 mt-1">프로필을 확인하고 비밀번호를 변경합니다.</p>
  </div>

  {{if .OK}}
  <div class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-800">{{.OK}}</div>
  {{end}}
  {{if .Error}}
  <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
  {{end}}

  <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div>
        <p class="text-xs text-gray-500 mb-1">아이디</p>
        <p class="font-medium text-gray-800">{{.User.Username}}</p>
      </div>
      <div>
        <p class="text-xs text-gray-500 mb-1">역할</p>
        <p class="font-medium text-gray-800">{{roleLabel .User.Role}}</p>
      </div>
    </div>

    <form method="POST" action="/account/profile" class="space-y-3 pt-2 border-t border-gray-100">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">이름</label>
        <input type="text" name="full_name" required value="{{.User.FullName}}"
               class="w-full border rounded-lg px-3 py-2 text-sm">
      </div>
      <button type="submit" class="px-4 py-2 bg-gray-800 hover:bg-gray-900 text-white rounded-lg text-sm font-medium">이름 저장</button>
    </form>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 p-6">
    <h3 class="text-sm font-semibold text-gray-800 mb-4">비밀번호 변경</h3>
    <form method="POST" action="/account/password" class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">현재 비밀번호</label>
        <input type="password" name="current_password" required autocomplete="current-password"
               class="w-full border rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">새 비밀번호</label>
        <input type="password" name="password" required minlength="4" autocomplete="new-password"
               class="w-full border rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">새 비밀번호 확인</label>
        <input type="password" name="password_confirm" required minlength="4" autocomplete="new-password"
               class="w-full border rounded-lg px-3 py-2 text-sm">
      </div>
      <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">비밀번호 변경</button>
    </form>
  </div>

  <div class="flex justify-end">
    <a href="/logout" class="px-4 py-2 border border-red-200 text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium">로그아웃</a>
  </div>
</div>
{{end}}
