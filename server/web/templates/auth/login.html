{{define "title"}}로그인 · 고객지원시스템{{end}}
{{define "content"}}
<div class="w-full max-w-sm mx-auto">
  <div class="text-center mb-8">
    <div class="w-14 h-14 bg-blue-500 rounded-xl flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-800">고객지원시스템</h1>
    <p class="text-sm text-gray-500 mt-1">CS Management System</p>
  </div>

  {{if .Error}}<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{{.Error}}</div>{{end}}
  {{if .HelpOK}}<div class="bg-green-50 border border-green-200 text-green-800 text-sm rounded-lg p-3 mb-4">{{.HelpOK}}</div>{{end}}
  {{if .HelpError}}<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">{{.HelpError}}</div>{{end}}

  <form method="POST" action="/login" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
      <input type="text" name="username" required autofocus
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
      <input type="password" name="password" required
             class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-lg py-2.5 text-sm font-medium transition-colors">
      로그인
    </button>
  </form>

  <div class="mt-4 bg-white rounded-xl border border-gray-200 p-4" x-data="{ open: {{if .HelpOpen}}true{{else}}false{{end}} }">
    <button type="button" class="text-sm text-blue-700 hover:underline" @click="open=!open">아이디·비밀번호를 잊으셨나요?</button>
    <form x-show="open" x-cloak method="POST" action="/login/help" class="mt-3 space-y-3">
      <input type="text" name="website" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">이름</label>
        <input type="text" name="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">핸드폰번호</label>
        <input type="text" name="mobile" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">소속 조직</label>
        <select name="org_id" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="">선택 안 함</option>
          {{range .Orgs}}<option value="{{.OrgID}}">{{.OrgName}}</option>{{end}}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">문의 내용</label>
        <select name="kind" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="unknown_id">아이디를 모름</option>
          <option value="reset_pw">비밀번호 초기화</option>
          <option value="other">직접 입력</option>
        </select>
        <textarea name="message" rows="2" class="mt-2 w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="추가로 알려 주실 내용"></textarea>
      </div>
      <button type="submit" class="w-full border border-gray-300 rounded-lg py-2 text-sm">문의하기</button>
    </form>
  </div>
</div>
{{end}}
