{{define "title"}}관리 섹션 잠금 · 고객지원시스템{{end}}
{{define "content"}}
<div class="max-w-md mx-auto space-y-4 py-8">
  <h2 class="text-xl font-bold text-gray-800">관리 섹션 비밀번호</h2>
  <p class="text-sm text-gray-600">비젼관리자 비밀번호를 입력하면 30분 동안 관리 메뉴를 쓸 수 있습니다. AS 수정 비밀번호와는 다릅니다.</p>
  {{if .Error}}
  <div class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{.Error}}</div>
  {{end}}
  <form method="POST" action="/admin/unlock" class="bg-white rounded-xl border border-gray-200 p-5 space-y-3">
    <input type="hidden" name="return" value="{{.ReturnPath}}">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">비젼관리자 비밀번호</label>
      <input type="password" name="unlock_password" required autocomplete="off" class="w-full border rounded-lg px-3 py-2 text-sm">
    </div>
    <button type="submit" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium">잠금 해제</button>
  </form>
  <p class="text-center"><a href="/" class="text-sm text-blue-700 hover:underline">대시보드로</a></p>
</div>
{{end}}
