{{define "title"}}노임단가 올리기 · 고객지원시스템{{end}}
{{define "content"}}
<div class="max-w-4xl mx-auto space-y-4">
  <div>
    <a href="/labor-rates?year={{.Year}}" class="text-sm text-gray-500 hover:underline">← 노임단가</a>
    <h2 class="text-xl font-bold text-gray-800 mt-1">노임단가 엑셀 올리기</h2>
    <p class="text-sm text-gray-500">파일은 저장하지 않습니다. 값만 미리보기한 뒤 반영합니다. 5MB · xlsx.</p>
  </div>
  <form method="post" action="/labor-rates/upload" enctype="multipart/form-data" class="bg-white rounded-xl border p-4 space-y-3 text-sm">
    <label class="block">연도 <input name="year" value="{{.Year}}" class="border rounded-lg px-2 py-1.5 w-28"></label>
    {{if .Sheets}}
    <label class="block">시트
      <select name="sheet" class="border rounded-lg px-2 py-1.5">
        {{range .Sheets}}<option value="{{.}}" {{if eq $.Sheet .}}selected{{end}}>{{.}}</option>{{end}}
      </select>
    </label>
    {{end}}
    <input type="file" name="file" accept=".xlsx" class="block">
    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg">미리보기</button>
  </form>
  {{if .Preview}}
  <form method="post" action="/labor-rates/upload/apply" class="bg-white rounded-xl border overflow-x-auto">
    <input type="hidden" name="year" value="{{.Year}}">
    <input type="hidden" name="file_name" value="{{.FileName}}">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b text-xs text-gray-500"><tr>
        <th class="px-3 py-2 text-left">직무</th>
        <th class="px-3 py-2">월</th>
        <th class="px-3 py-2">일</th>
        <th class="px-3 py-2">시</th>
        <th class="px-3 py-2 text-left">판정</th>
        <th class="px-3 py-2 text-left">짝짓기</th>
      </tr></thead>
      <tbody class="divide-y">
        {{range $i, $r := .Rows}}
        <tr>
          <td class="px-3 py-2"><input name="job_name" value="{{$r.Name}}" class="w-full border rounded px-2 py-1"></td>
          <td class="px-3 py-2"><input name="monthly" value="{{$r.Monthly}}" class="w-28 text-right border rounded px-2 py-1"></td>
          <td class="px-3 py-2"><input name="daily" value="{{$r.Daily}}" class="w-24 text-right border rounded px-2 py-1"></td>
          <td class="px-3 py-2"><input name="hourly" value="{{$r.Hourly}}" class="w-20 text-right border rounded px-2 py-1"></td>
          <td class="px-3 py-2 text-xs {{if $r.Unmatched}}text-rose-700{{end}}">{{$r.Verdict}}</td>
          <td class="px-3 py-2">
            <select name="job_code" class="border rounded px-2 py-1 text-xs">
              <option value="{{$r.JobCode}}">{{if $r.JobCode}}{{$r.JobCode}}{{else}}새 직무{{end}}</option>
              {{range $.Existing}}<option value="{{.JobCode}}">{{.JobCode}} {{.JobName}}</option>{{end}}
            </select>
            {{if $r.Unmatched}}<label class="text-xs text-gray-500 ml-1"><input type="checkbox" name="skip" value="{{$i}}"> 건너뛰기</label>{{end}}
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
    <div class="p-3 border-t"><button class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm">반영</button></div>
  </form>
  {{end}}
</div>
{{end}}
