{{define "board_period_seg"}}
<div class="inline-flex shrink-0 flex-nowrap whitespace-nowrap rounded-xl border border-line bg-surface p-0.5" role="group" aria-label="기간">
  <a href="{{.PeriodDayHref}}" class="rounded-lg px-3 py-1.5 text-ui font-bold {{if eq .Period `day`}}bg-success text-primary-fg{{else}}text-ink-muted{{end}}">일</a>
  <a href="{{.PeriodWeekHref}}" class="rounded-lg px-3 py-1.5 text-ui font-bold {{if eq .Period `week`}}bg-success text-primary-fg{{else}}text-ink-muted{{end}}">주</a>
  <a href="{{.PeriodMonthHref}}" class="rounded-lg px-3 py-1.5 text-ui font-bold {{if eq .Period `month`}}bg-success text-primary-fg{{else}}text-ink-muted{{end}}">월</a>
</div>
{{end}}

{{define "board_display_seg"}}
<div class="inline-flex shrink-0 flex-nowrap whitespace-nowrap rounded-xl border border-line bg-surface p-0.5" role="group" aria-label="보기">
  <a href="{{.SummaryHref}}" class="rounded-lg px-3 py-1.5 text-ui font-bold {{if eq .Display `summary`}}bg-success text-primary-fg{{else}}text-ink-muted{{end}}">요약</a>
  <a href="{{.ScheduleHref}}" class="rounded-lg px-3 py-1.5 text-ui font-bold {{if eq .Display `schedule`}}bg-success text-primary-fg{{else}}text-ink-muted{{end}}">일정표</a>
  <a href="{{.KanbanHref}}" class="rounded-lg px-3 py-1.5 text-ui font-bold {{if eq .Display `kanban`}}bg-success text-primary-fg{{else}}text-ink-muted{{end}}">칸반</a>
</div>
{{end}}

{{define "board_period_seg_cal"}}{{template "board_period_seg" .}}{{end}}
{{define "board_period_seg_list"}}{{template "board_period_seg" .}}{{end}}
