{{define "board_member_filter"}}
{{if .ShowMemberFilter}}
<section class="card" x-show="!closed" x-cloak aria-label="팀원별 보기">
  <div class="flex flex-wrap items-center justify-between gap-2 border-b border-line px-4 py-3">
    <h2 class="text-ui font-bold text-ink">팀원별 보기</h2>
    <div class="flex items-center gap-2">
      <button type="button" class="btn btn-ghost btn-sm" @click="toggleFold()" :aria-label="collapsed ? '펼치기' : '접기'" x-text="collapsed ? '펼치기' : '접기'">접기</button>
      <button type="button" class="btn btn-ghost btn-sm" @click="closeBox()" aria-label="닫기">닫기</button>
    </div>
  </div>
  <form method="get" action="/workboard/board" class="px-4 py-3" x-show="!collapsed">
    <input type="hidden" name="view" value="list">
    <input type="hidden" name="date" value="{{.Date}}">
    {{if .ShowParam}}<input type="hidden" name="show" value="{{.ShowParam}}">{{end}}
    {{if eq .MineParam "0"}}<input type="hidden" name="mine" value="0">{{end}}
    {{if .AssigneeFilter}}<input type="hidden" name="assignee" value="{{.AssigneeFilter}}">{{end}}
    {{if .Q}}<input type="hidden" name="q" value="{{.Q}}">{{end}}
    <div class="flex flex-wrap items-center gap-3 text-ui text-ink">
      <label class="inline-flex items-center gap-1.5">
        <input type="checkbox" {{if not .MemberFilterOn}}checked{{end}}
               onchange="if(this.checked) location.href='{{.MemberAllHref}}'">
        <span>전체</span>
      </label>
      {{range .TeamMembers}}
      <label class="inline-flex items-center gap-1.5">
        <input type="checkbox" name="members" value="{{.UserID}}" {{if .Checked}}checked{{end}} onchange="this.form.submit()">
        <span>{{.Name}}</span>
      </label>
      {{end}}
    </div>
  </form>
</section>
<script>
function memberFilterBox(){
  return {
    closed: false,
    collapsed: false,
    init(){
      try {
        this.closed = localStorage.getItem('jp-board-member-filter-closed') === '1';
        this.collapsed = localStorage.getItem('jp-board-member-filter-collapsed') === '1';
      } catch (e) {}
    },
    closeBox(){ this.closed = true; this.persist(); },
    openBox(){ this.closed = false; this.persist(); },
    toggleFold(){ this.collapsed = !this.collapsed; this.persist(); },
    persist(){
      try {
        localStorage.setItem('jp-board-member-filter-closed', this.closed ? '1' : '0');
        localStorage.setItem('jp-board-member-filter-collapsed', this.collapsed ? '1' : '0');
      } catch (e) {}
    }
  };
}
</script>
{{end}}
{{end}}
