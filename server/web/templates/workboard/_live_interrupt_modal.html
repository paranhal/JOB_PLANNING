{{define "live_interrupt_modal"}}
{{if .CanWrite}}
<div id="live-interrupt-modal" hidden class="modal-backdrop z-50 flex items-center justify-center p-4" data-live-interrupt-modal="1">
  <div class="modal-panel w-full max-w-lg shadow-pop max-h-[90vh] overflow-y-auto">
    <h3 class="text-ui font-bold text-ink">다른 업무 끼워넣기</h3>
    <p class="text-ui-sm text-ink-muted mt-1">기존 업무 등록 모달과 같은 5종을 씁니다. 외근이면 이동시간을 입력하세요.</p>
    {{if .LiveStartHint}}<p class="text-xs text-warning mt-2" data-live-type-hint="1">{{.LiveStartHint}}</p>{{end}}
    <form method="post" action="/workboard/tasks/{{if .Task}}{{.Task.TaskID}}{{end}}/live/interrupt" class="mt-3 space-y-3">
      <input type="hidden" name="live_json" value="1">
      <label class="block text-sm">유형
        <select name="work_type" class="w-full border rounded-lg px-3 py-2">
          <option value="admin">행정/지원</option>
          <option value="project_work">작업</option>
          <option value="as">AS</option>
          <option value="maintenance">정기점검</option>
          <option value="sales">영업</option>
        </select>
      </label>
      <label class="block text-sm">업무명 <input name="title" class="w-full border rounded-lg px-3 py-2" required></label>
      <label class="block text-sm">예상 소요(분) <input name="duration_min" type="number" value="60" class="w-full border rounded-lg px-3 py-2"></label>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="field_work" value="1"> 외근</label>
      <div class="grid grid-cols-2 gap-2">
        <label class="block text-sm">출발지 <input name="travel_origin" class="w-full border rounded-lg px-3 py-2"></label>
        <label class="block text-sm">목적지 <input name="travel_dest" class="w-full border rounded-lg px-3 py-2"></label>
        <label class="block text-sm">업무 전 이동 <input name="travel_before_min" type="number" class="w-full border rounded-lg px-3 py-2"></label>
        <label class="block text-sm">업무 후 이동 <input name="travel_after_min" type="number" class="w-full border rounded-lg px-3 py-2"></label>
      </div>
      <label class="block text-sm">이동 미정 사유 <input name="travel_unknown_reason" class="w-full border rounded-lg px-3 py-2"></label>
      <p class="text-xs text-ink-muted">다음 고정 일정과 겹치면 아래 5가지를 고릅니다.</p>
      <ul class="text-xs list-disc pl-4 text-ink-muted" data-fit-choices="1">
        {{range .LiveFitChoices}}<li>{{.}}</li>{{end}}
      </ul>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="force" value="1"> 충돌을 알고 강제 배치</label>
      <label class="block text-sm">강제 사유 <input name="force_reason" class="w-full border rounded-lg px-3 py-2"></label>
      <div class="flex justify-end gap-2">
        <button type="button" class="btn btn-secondary" data-live-interrupt-close="1">취소</button>
        <button class="btn btn-primary">끼워넣기</button>
      </div>
    </form>
    <p class="text-[11px] text-ink-subtle mt-2">또는 업무 등록 모달에서 같은 경로로 등록합니다.</p>
  </div>
</div>
{{end}}
{{end}}
