{{define "occ_close_modal"}}
<div id="occ-close-modal" hidden data-occ-close-modal class="fixed inset-0 z-50 bg-ink/50 flex items-end md:items-center justify-center p-0 md:p-4">
  <div role="dialog" aria-modal="true" aria-labelledby="occ-close-title" class="w-full md:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-2xl md:rounded-card bg-canvas p-4 shadow-pop">
    <h2 id="occ-close-title" class="text-ui font-bold text-ink">업무 모두 종료</h2>
    <p class="mt-1 text-ui-sm text-ink-muted">이 회차를 완료하고 이후 일정을 제외한 뒤 상위 업무를 종료합니다.</p>
    <p class="mt-2 text-ui-sm text-ink-muted" data-occ-close-loading>건수를 불러오는 중…</p>
    <form method="post" action="" data-occ-close-form hidden class="mt-3 space-y-3">
      <input type="hidden" name="earlier_sent" value="1">
      <ul class="text-ui-sm text-ink space-y-1.5" data-occ-close-summary>
        <li data-sum-this>① 이 회차 완료 · <span data-occ-title></span> <span class="text-ui-xs text-ink-muted" data-occ-date></span></li>
        <li data-sum-later>② 이후 일정 제외 <b data-later>0</b>건 <span class="text-ui-xs text-ink-muted" data-later-detail></span></li>
        <li data-sum-earlier hidden>③ 이전 미완료 <b data-earlier>0</b>건
          <label class="ml-2 inline-flex items-center gap-1.5"><input type="checkbox" name="include_earlier" value="1" checked data-include-earlier class="rounded"> 함께 제외</label>
        </li>
      </ul>
      <label class="block">
        <span class="block text-ui-sm font-extrabold text-ink mb-1">종료 사유 <span class="text-danger">*</span></span>
        <input type="text" name="close_reason" maxlength="200" class="input w-full" placeholder="예: 고객 요청으로 조기 종료" autocomplete="off" data-close-reason>
      </label>
      <label class="block" data-final-box data-need-final="0" hidden>
        <span class="block text-ui-sm font-extrabold text-ink mb-1">최종 결과 <span class="text-danger">*</span></span>
        <textarea name="final_result" rows="3" class="textarea w-full" placeholder="상위 업무의 최종 결과를 입력합니다" data-final-result></textarea>
      </label>
      <p class="text-ui-sm text-warning" data-earlier-note hidden>이전 미완료가 남으면 상위 업무는 진행 중으로 둡니다.</p>
      <div class="flex justify-end gap-2">
        <button type="button" class="btn-secondary btn-sm" data-occ-close-cancel>취소</button>
        <button type="submit" class="btn-primary btn-sm" data-occ-close-submit disabled>업무 모두 종료</button>
      </div>
    </form>
    <p class="mt-3 text-ui-sm text-danger" data-occ-close-err hidden></p>
    <div class="mt-3 flex justify-end" data-occ-close-errbar hidden>
      <button type="button" class="btn-secondary btn-sm" data-occ-close-cancel>닫기</button>
    </div>
  </div>
</div>
<script src="/static/js/occ_close_all.js?v={{assetQ}}"></script>
{{end}}
