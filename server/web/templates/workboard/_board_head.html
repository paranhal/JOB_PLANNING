{{define "board_cal_head"}}
<section class="card">
  <div class="flex flex-wrap items-center justify-between gap-3 px-6 py-4">
    <div>
      <p class="text-ui-sm font-extrabold tracking-wide text-success">업무 관리</p>
      <h1 class="mt-0.5 text-2xl font-bold text-ink">{{.Title}}</h1>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      {{template "board_top_controls" .}}
    </div>
  </div>
</section>
<div class="card mt-4 overflow-hidden">
  <div class="flex items-center gap-2 px-5 py-3.5">
    <a href="{{.PrevHref}}" data-nav-replace class="inline-flex h-8 w-8 items-center justify-center rounded-[10px] border border-line bg-surface text-ink" aria-label="이전">‹</a>
    <p class="min-w-0 text-lg font-extrabold text-ink">{{.PeriodLabel}}</p>
    <a href="{{.NextHref}}" data-nav-replace class="inline-flex h-8 w-8 items-center justify-center rounded-[10px] border border-line bg-surface text-ink" aria-label="다음">›</a>
    <a href="{{.TodayHref}}" data-nav-replace class="ml-1 inline-flex h-8 items-center rounded-lg border border-line bg-surface px-2 text-ui-sm font-semibold text-ink">오늘</a>
  </div>
{{end}}
