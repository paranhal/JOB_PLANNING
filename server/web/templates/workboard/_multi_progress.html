{{define "multi_progress"}}
{{if .ParentProgress}}
<div class="grid grid-cols-2 md:grid-cols-4 gap-2" data-multi-progress="1">
  <div class="rounded-lg border bg-white p-3"><p class="text-lg font-bold">{{.ProgressCount}}</p><p class="text-[11px] text-ink-muted">회차 진행</p><p class="text-xs">{{.ProgressCountPct}}</p></div>
  <div class="rounded-lg border bg-white p-3"><p class="text-lg font-bold">{{.ProgressTime}}</p><p class="text-[11px] text-ink-muted">시간 진척</p><p class="text-xs">{{.ProgressTimePct}}</p></div>
  <div class="rounded-lg border bg-white p-3"><p class="text-lg font-bold">{{.ProgressRemain}}</p><p class="text-[11px] text-ink-muted">남은 예상</p></div>
  <div class="rounded-lg border bg-white p-3"><p class="text-lg font-bold">{{.ParentProgress.InterruptCount}}건</p><p class="text-[11px] text-ink-muted">끼어든 업무</p></div>
</div>
{{end}}
{{end}}
