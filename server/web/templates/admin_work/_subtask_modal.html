{{define "wb_subtask_modal"}}
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50" x-show="typeof subOpen !== 'undefined' && subOpen" x-cloak
     @keydown.escape.window="subOpen=false">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto" @click.outside="subOpen=false">
    <div class="flex items-center justify-between px-5 py-4 border-b">
      <h3 class="font-semibold text-gray-800">행정·지원업무 등록</h3>
      <button type="button" @click="subOpen=false" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
    </div>
    <form method="post" action="/admin-work" class="p-5 space-y-4 text-sm">
      <input type="hidden" name="parent_task_id" x-model="subParent">
      <input type="hidden" name="redirect" :value="subRedirect">
      <p class="text-xs text-gray-500">상위 <span class="font-mono text-gray-800" x-text="subParent"></span> · 담당자·거래처·사업은 기본값이며 고칠 수 있습니다.</p>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">업무 구분 <span class="text-red-500">*</span></label>
        <div class="grid grid-cols-2 gap-2">
          <label class="flex items-center gap-2 border rounded-lg px-3 py-2 cursor-pointer"
                 :class="subWorkType === 'admin' ? 'border-violet-500 bg-violet-50' : 'border-gray-200'">
            <input type="radio" name="work_type" value="admin" x-model="subWorkType" class="text-violet-600">
            <span>행정업무</span>
          </label>
          <label class="flex items-center gap-2 border rounded-lg px-3 py-2 cursor-pointer"
                 :class="subWorkType === 'support' ? 'border-violet-500 bg-violet-50' : 'border-gray-200'">
            <input type="radio" name="work_type" value="support" x-model="subWorkType" class="text-violet-600">
            <span>지원업무</span>
          </label>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">거래처</label>
        <select name="customer_id" x-model="subCustomer" class="w-full border rounded-lg px-3 py-2">
          <option value="">— 기관 선택 —</option>
          {{range .Customers}}<option value="{{.CustomerID}}">{{.OrgName}}</option>{{end}}
        </select>
        <input name="customer_name" x-model="subCustomerName" class="mt-2 w-full border rounded-lg px-3 py-2" placeholder="목록에 없으면 직접입력">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">업무명 <span class="text-red-500">*</span></label>
        <input name="title" required class="w-full border rounded-lg px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">업무 내용</label>
        <textarea name="description" rows="2" class="w-full border rounded-lg px-3 py-2"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">사업명 <span class="text-red-500" x-show="subWorkType === 'support'">*</span></label>
        <select name="project_id" x-model="subProject" :required="subWorkType === 'support'" class="w-full border rounded-lg px-3 py-2">
          <option value="">— 선택 (해당 시) —</option>
          {{range .Projects}}<option value="{{.ProjectID}}">{{.Name}}</option>{{end}}
        </select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">업무 시작일</label>
          <input type="date" name="work_date" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">업무 종료일 <span class="text-red-500">*</span></label>
          <input type="date" name="due_date" required value="{{.Today}}" class="w-full border rounded-lg px-3 py-2">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">담당자</label>
          <select name="assignee" x-model="subAssignee" class="w-full border rounded-lg px-3 py-2">
            <option value="">— 선택 —</option>
            {{range .Assignees}}<option value="{{.FullName}}">{{.FullName}}</option>{{end}}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">소요시간</label>
          <div class="flex items-center gap-2">
            <input type="number" name="duration_min" min="1" value="30" class="w-full border rounded-lg px-3 py-2">
            <span class="text-sm text-gray-500 shrink-0">분</span>
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" @click="subOpen=false" class="px-4 py-2 text-sm border rounded-lg">취소</button>
        <button type="submit" class="px-4 py-2 text-sm text-white bg-violet-600 rounded-lg">저장</button>
      </div>
    </form>
  </div>
</div>
{{end}}
