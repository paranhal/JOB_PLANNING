<div class="modal-backdrop" data-coop-dialog-root>
  <div role="dialog" aria-modal="true" aria-labelledby="coop-new-title" class="modal-panel mx-auto mt-10 max-w-lg w-full space-y-3 max-h-[90vh] overflow-y-auto">
    <div class="flex items-start justify-between gap-2">
      <h2 id="coop-new-title" class="text-ui-xl font-extrabold text-ink">{{.Title}}</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-close-coop>닫기</button>
    </div>
    {{if .Err}}<p class="text-ui text-danger">{{.Err}}</p>{{end}}
    <form method="post" action="/cooperations" enctype="multipart/form-data" class="space-y-3">
      <div>
        <label class="text-ui-sm text-ink-muted" for="coop-target">대상 팀</label>
        <select id="coop-target" name="target_org_id" required class="select w-full">
          <option value="">선택</option>
          {{range .Targets}}
          <option value="{{.OrgID}}">{{.OrgName}}</option>
          {{end}}
        </select>
      </div>
      <div>
        <label class="text-ui-sm text-ink-muted" for="coop-kind">구분</label>
        <select id="coop-kind" name="kind" required class="select w-full">
          <option value="as">AS</option>
          <option value="inspection">정기점검</option>
          <option value="admin">행정·지원</option>
          <option value="project">사업 수행</option>
        </select>
      </div>
      <div>
        <label class="text-ui-sm text-ink-muted" for="coop-title">제목</label>
        <input id="coop-title" name="title" required class="input w-full">
      </div>
      <div>
        <label class="text-ui-sm text-ink-muted" for="coop-body">내용</label>
        <textarea id="coop-body" name="body" required rows="4" class="input w-full"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-ui-sm text-ink-muted" for="coop-want-s">희망 시작</label>
          <input id="coop-want-s" type="date" name="want_start" class="input w-full">
        </div>
        <div>
          <label class="text-ui-sm text-ink-muted" for="coop-want-e">희망 종료</label>
          <input id="coop-want-e" type="date" name="want_end" class="input w-full">
        </div>
      </div>
      <div>
        <label class="text-ui-sm text-ink-muted" for="coop-project">연결 사업</label>
        <select id="coop-project" name="project_id" class="select w-full">
          <option value="">없음</option>
          {{range .Projects}}
          <option value="{{.ProjectID}}">{{.Name}}</option>
          {{end}}
        </select>
      </div>
      <div>
        <label class="text-ui-sm text-ink-muted" for="coop-photos">사진 (최대 5장)</label>
        <input id="coop-photos" type="file" name="photos" accept="image/*" multiple class="input w-full">
      </div>
      <button type="submit" class="btn btn-primary">요청 보내기</button>
    </form>
  </div>
</div>
