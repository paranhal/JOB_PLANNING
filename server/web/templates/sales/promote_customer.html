{{define "title"}}{{.Title}} · 영업 사업{{end}}

{{define "content"}}
<div class="max-w-xl mx-auto space-y-4">
  <div>
    <a href="/sales/{{.SalesID}}" class="text-sm text-gray-500 hover:underline">← 돌아가기</a>
    <h2 class="text-xl font-bold text-gray-800 mt-1">{{.Title}}</h2>
    <p class="text-sm text-gray-500 mt-1">자산·AS가 붙으려면 고객 번호가 필요합니다. 「{{.SalesName}}」을 사업관리로 올리기 전에 고객 마스터에 등록합니다.</p>
  </div>

  {{if .FormError}}
  <div class="rounded-lg bg-red-50 text-red-800 text-sm px-4 py-2 border border-red-200">{{.FormError}}</div>
  {{end}}

  <form method="post" action="/sales/{{.SalesID}}/promote/customer" class="bg-white rounded-xl border border-gray-200 p-5 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">기관명 <span class="text-red-500">*</span></label>
      <input name="org_name" required value="{{.Customer.OrgName}}" class="w-full border rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">공식명칭</label>
      <input name="official_name" value="{{.Customer.OfficialName}}" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="비우면 기관명과 같게 둡니다">
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">대표전화</label>
        <input name="main_phone" value="{{.Customer.MainPhone}}" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="모르면 비워 두세요">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">업종</label>
        <select name="industry" class="w-full border rounded-lg px-3 py-2 text-sm">
          <option value="공공기관" {{if eq .Customer.Industry "공공기관"}}selected{{end}}>공공기관</option>
          <option value="도서관" {{if eq .Customer.Industry "도서관"}}selected{{end}}>도서관</option>
          <option value="학교" {{if eq .Customer.Industry "학교"}}selected{{end}}>학교</option>
          <option value="민간" {{if eq .Customer.Industry "민간"}}selected{{end}}>민간</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-2">
      <a href="/sales/{{.SalesID}}" class="px-4 py-2 text-sm border rounded-lg">취소</a>
      <button type="submit" class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg">고객 등록 후 계속</button>
    </div>
  </form>
</div>
{{end}}
