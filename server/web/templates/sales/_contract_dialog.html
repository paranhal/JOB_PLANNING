<div class="modal-backdrop" data-sales-dialog-root>
  <div role="dialog" aria-modal="true" aria-labelledby="sales-contract-title" class="modal-panel mx-auto mt-16 max-w-lg w-full space-y-3">
    <div class="flex items-start justify-between gap-2">
      <h2 id="sales-contract-title" class="text-ui-xl font-extrabold text-ink">계약으로 전환</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-close-sales-dialog>취소</button>
    </div>
    <p class="text-ui-sm text-ink-muted" data-sales-dialog-err hidden></p>
    <dl class="grid grid-cols-2 gap-2 text-ui-sm">
      <div><dt class="text-ink-muted">사업번호</dt><dd class="text-ink font-mono">{{.Project.DisplayNo}}</dd></div>
      <div><dt class="text-ink-muted">사업명</dt><dd class="text-ink">{{.Project.Name}}</dd></div>
    </dl>
    <form method="post" action="/sales/{{.Project.SalesID}}/close-contract" class="space-y-3" data-sales-next-form>
      <input type="hidden" name="return" value="{{.Return}}">
      <div>
        <label class="text-ui-sm text-ink-muted" for="sales-contracted-at">계약일</label>
        <input id="sales-contracted-at" type="date" name="contracted_at" value="{{.Today}}" required class="input w-full" data-field="contracted_at">
        <p class="text-ui-xs text-danger mt-1" data-field-error="contracted_at" hidden></p>
      </div>
      <div>
        <label class="text-ui-sm text-ink-muted" for="sales-contract-amount">계약금액 (0 가능)</label>
        <input id="sales-contract-amount" type="number" name="contract_amount" min="0" required value="{{.Amount}}" class="input w-full" data-field="contract_amount">
        <p class="text-ui-xs text-danger mt-1" data-field-error="contract_amount" hidden></p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary btn-sm">계약 확정</button>
        <button type="button" class="btn btn-ghost btn-sm" data-close-sales-dialog>취소</button>
      </div>
    </form>
  </div>
</div>
