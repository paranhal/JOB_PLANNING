{{define "title"}}{{.Title}} · 고객지원시스템{{end}}
{{define "content"}}
<div class="max-w-lg mx-auto space-y-4">
  <h2 class="text-xl font-bold text-gray-800">휴면 해제 · {{.Project.DisplayNo}} {{.Project.Name}}</h2>
  <p class="text-sm text-gray-500">예산 연도는 다음 해로 제안합니다. 저장 전에 고칠 수 있습니다.</p>
  <form method="post" action="/sales/{{.Project.SalesID}}/wake" class="bg-white rounded-xl border p-5 space-y-3">
    <div>
      <label class="block text-sm font-medium mb-1">예산 연도</label>
      <input name="budget_year" type="number" value="{{.BudgetYear}}" class="w-full border rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">예산 상태</label>
      <select name="budget_status" class="w-full border rounded-lg px-3 py-2 text-sm">
        <option value="unknown" selected>미확인</option>
        <option value="not_reflected">미반영</option>
        <option value="requesting">요청·협의 중</option>
        <option value="confirmed">반영 확정</option>
        <option value="no_plan">예산 계획 없음</option>
      </select>
    </div>
    <div class="flex justify-end gap-2">
      <a href="/sales/{{.Project.SalesID}}" class="px-4 py-2 border rounded-lg text-sm">취소</a>
      <button class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm">지금 깨우기</button>
    </div>
  </form>
</div>
{{end}}
