{{define "sales_dnd"}}
<script>
function salesDnd(opts) {
  opts = opts || {};
  return {
    async openDrop() {
      const parts = location.pathname.split('/');
      const id = parts[2];
      const res = await fetch('/sales/' + encodeURIComponent(id) + '/drop.json');
      const d = await res.json().catch(function(){ return {}; });
      if (!d.ok) { alert(d.error || '드롭할 수 없습니다'); return; }
      const labels = (d.reasons || []).map(function(r){ return r.code_value + ':' + r.code_name; }).join('\n');
      const code = prompt(d.name + ' · ' + d.stage + ' · ' + d.prob + '%\n미완료 예정 업무 ' + d.open_tasks + '건 취소\n유효 견적 ' + d.quotes + '건 파이프라인 제외\n\n사유 코드:\n' + labels);
      if (!code) return;
      let reason = '';
      if (code === 'etc') {
        reason = prompt('상세 사유');
        if (!reason) return;
      }
      if (code === 'postponed') {
        if (confirm('휴면으로 두시겠습니까?')) {
          const until = prompt('다시 볼 연월 (YYYY-MM)', d.dormant_until || '');
          if (!until) return;
          const why = prompt('휴면 사유') || reason || '고객 사업 무기한 연기';
          const body = new URLSearchParams({ reason_code: code, reason: why, as_dormant: '1', until: until });
          const post = await fetch('/sales/' + encodeURIComponent(id) + '/drop', {
            method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' }, body: body
          });
          const out = await post.json().catch(function(){ return { ok:false }; });
          if (!out.ok) { alert(out.error || '저장 실패'); return; }
          location.reload();
          return;
        }
      }
      const body = new URLSearchParams({ reason_code: code, reason: reason || '' });
      const post = await fetch('/sales/' + encodeURIComponent(id) + '/drop', {
        method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' }, body: body
      });
      const out = await post.json().catch(function(){ return { ok:false }; });
      if (!out.ok) { alert(out.error || '저장 실패'); return; }
      location.reload();
    },
    group: opts.group || 'type',
    dragging: null,
    reasonOpen: false,
    reason: '',
    pending: null,
    lostOpen: false,
    dragProject(ev, id, from) {
      this.dragging = { id: id, from: from, fromSort: this._fromSort(from) };
      try { ev.dataTransfer.setData('text/plain', id); } catch (e) {}
    },
    dropProject(ev, to, toSort, isLost) {
      if (!this.dragging || this.dragging.from === to) return;
      const fromSort = parseInt(this.dragging.fromSort, 10);
      this.applyProjectMove(this.dragging.id, fromSort, to, toSort, isLost);
      this.dragging = null;
    },
    pickStage(id, from, fromSort, to, toSort, isLost) {
      if (!id || from === to) return;
      this.applyProjectMove(id, fromSort, to, toSort, isLost);
    },
    applyProjectMove(id, fromSort, to, toSort, isLost) {
      fromSort = parseInt(fromSort, 10);
      toSort = parseInt(toSort, 10);
      if (to === 'closed') {
        alert('상세에서 종료하세요');
        return;
      }
      if (to === 'bid') {
        const el = document.querySelector('[data-freeze-prob]');
        const nn = el ? el.getAttribute('data-freeze-prob') : '';
        if (!confirm('수주 확도 ' + (nn || '') + '% 로 확정합니다. 입찰 뒤에는 바꿀 수 없습니다.')) {
          return;
        }
      }
      const need = (!isNaN(fromSort) && !isNaN(toSort) && toSort < fromSort);
      if (need) {
        this.pending = { id: id, to: to, lost: !!isLost };
        this.reason = '';
        this.reasonOpen = true;
        return;
      }
      this.postStage(id, to, '');
    },
    _fromSort(stage) {
      const cols = document.querySelectorAll('[data-col]');
      for (const c of cols) {
        if (c.getAttribute('data-col') === stage) return c.getAttribute('data-sort');
      }
      return '0';
    },
    submitReason() {
      if (!this.pending) return;
      this.postStage(this.pending.id, this.pending.to, this.reason);
    },
    async postStage(id, to, reason) {
      const body = new URLSearchParams({
        stage: to,
        reason: reason || '',
        return: location.pathname + location.search
      });
      const res = await fetch('/sales/' + encodeURIComponent(id) + '/stage', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      });
      const data = await res.json().catch(function () { return { ok: false, error: '저장에 실패했습니다' }; });
      if (!data.ok) {
        alert(data.error || '저장에 실패했습니다');
        return;
      }
      location.reload();
    },
    dragAct(ev, id) {
      this.dragging = { id: id };
      try { ev.dataTransfer.setData('text/plain', id); } catch (e) {}
    },
    dropAct(ev, value) {
      if (!this.dragging) return;
      this.postAct(this.dragging.id, value);
    },
    async postAct(id, value) {
      const body = new URLSearchParams({
        group: this.group,
        value: value,
        return: location.pathname + location.search
      });
      const res = await fetch('/sales/activities/' + encodeURIComponent(id) + '/move', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      });
      const data = await res.json().catch(function () { return { ok: false, error: '저장에 실패했습니다' }; });
      if (!data.ok) {
        alert(data.error || '저장에 실패했습니다');
        return;
      }
      location.reload();
    }
  };
}
</script>
{{end}}
