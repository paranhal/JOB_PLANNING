<div class="modal-backdrop" data-sales-dialog-root>
  <div role="dialog" aria-modal="true" aria-labelledby="sales-win-title" class="modal-panel mx-auto mt-16 max-w-lg w-full space-y-3">
    <div class="flex items-start justify-between gap-2">
      <h2 id="sales-win-title" class="text-ui-xl font-extrabold text-ink">수주 확정</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-close-sales-dialog>취소</button>
    </div>
    <p class="text-ui-sm text-ink-muted" data-sales-dialog-err hidden></p>
    <dl class="grid grid-cols-2 gap-2 text-ui-sm">
      <div><dt class="text-ink-muted">사업번호</dt><dd class="text-ink font-mono">{{.Project.DisplayNo}}</dd></div>
      <div><dt class="text-ink-muted">사업명</dt><dd class="text-ink">{{.Project.Name}}</dd></div>
      <div class="col-span-2"><dt class="text-ink-muted">고객</dt><dd class="text-ink">{{if .Project.CustomerValue}}{{.Project.CustomerValue}}{{else}}{{if .Project.ProspectName}}{{.Project.ProspectName}}{{else}}—{{end}}{{end}}</dd></div>
      <div class="col-span-2"><dt class="text-ink-muted">예상금액</dt><dd class="text-ink">{{won .Project.ExpectedAmount}}</dd></div>
    </dl>
    <form method="post" action="/sales/{{.Project.SalesID}}/win-confirm" class="space-y-3" data-sales-next-form>
      <input type="hidden" name="result" value="won">
      <input type="hidden" name="return" value="{{.Return}}">
      <div>
        <label class="text-ui-sm text-ink-muted" for="sales-won-at">수주일</label>
        <input id="sales-won-at" type="date" name="won_at" value="{{.WonAt}}" required class="input w-full" data-field="won_at">
        <p class="text-ui-xs text-danger mt-1" data-field-error="won_at" hidden></p>
      </div>
      <div>
        <label class="text-ui-sm text-ink-muted" for="sales-won-amount">수주 금액 (선택)</label>
        <input id="sales-won-amount" type="number" name="amount" min="0" placeholder="비우면 예상금액 유지" class="input w-full" data-field="amount">
        <p class="text-ui-xs text-danger mt-1" data-field-error="amount" hidden></p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary btn-sm">수주 확정</button>
        <button type="button" class="btn btn-ghost btn-sm" data-close-sales-dialog>취소</button>
      </div>
    </form>
    {{if .ShowLost}}
    <form method="post" action="/sales/{{.Project.SalesID}}/win-confirm" class="space-y-2 border-t pt-3" data-sales-next-form data-sales-lost-form>
      <input type="hidden" name="result" value="lost">
      <input type="hidden" name="return" value="{{.Return}}">
      <label class="text-ui-sm text-ink-muted" for="sales-lost-reason">실주 처리</label>
      <input id="sales-lost-reason" name="reason" required placeholder="실주 사유" class="input w-full" data-field="reason">
      <p class="text-ui-xs text-danger mt-1" data-field-error="reason" hidden></p>
      <button type="submit" class="btn btn-ghost btn-sm text-danger">실주 처리</button>
    </form>
    {{end}}
  </div>
</div>
