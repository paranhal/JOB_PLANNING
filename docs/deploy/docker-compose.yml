services:
  app:
    container_name: server-app-1
    image: server-app:latest
    ports:
      - "8888:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - ./.env
    environment:
      - PORT=8080
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/app.db
      - APP_ENV=production
      - TZ=Asia/Seoul
    restart: unless-stopped
