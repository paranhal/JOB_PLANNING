<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif; fill: #303744; }
      .label { font-size: 12px; font-weight: 600; }
      .small { font-size: 10px; fill: #737b88; }
      .tiny { font-size: 9px; fill: #818997; }
      .title { font-size: 22px; font-weight: 700; }
      .line { stroke: #c8cdd5; stroke-width: 1; }
      .strong-line { stroke: #9fa7b3; stroke-width: 1.25; }
      .surface { fill: #fff; stroke: #c8cdd5; }
      .soft { fill: #f4f5f7; }
      .accent { fill: #e7edf8; stroke: #8292ad; }
      .button { fill: #fff; stroke: #aeb5c0; }
      .primary { fill: #4f607c; stroke: #4f607c; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#eef0f3"/>

  <!-- Sidebar -->
