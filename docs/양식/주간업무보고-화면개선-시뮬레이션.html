<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 업무 보고 시뮬레이션</title>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --line:#e3e8e5; --fg:#1f2a26; --mute:#6b7872; --faint:#a3aea8;
  --brand:#0f6e56; --brand-soft:#e4f3ee; --brand-dk:#0c5c47;
  --late:#d33a3a; --warn-bg:#fff8e6; --warn-line:#f0dca0; --warn-fg:#7a5a00;
  --need:#fdeee8; --need-fg:#b24420; --dec:#e8f1fc; --dec-fg:#2b5fb3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.sim{margin:0;padding:8px max(16px,3vw);border-bottom:1px dashed var(--line);background:#fff;color:var(--mute);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.sim select{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:inherit;background:#fff}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px max(16px,3vw);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.logo b{display:block;font-size:15px}.logo small{color:var(--mute);font-size:12px}
.pill{border:1px solid var(--line);background:#f7f9f8;border-radius:99px;padding:6px 16px;font-size:12.5px;font-weight:600;color:var(--mute)}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(16px,3vw) 60px}
.eyebrow{font-size:13px;font-weight:800;color:var(--brand)}
h1{margin:6px 0 4px;font-size:36px;letter-spacing:-.02em;text-wrap:balance}
.desc{color:var(--mute);font-size:14px}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{height:44px;padding:0 18px;border:1px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#f7f9f8}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-dk)}
.btn.ghost{border-color:var(--brand);color:var(--brand)}
.btn.sm{height:34px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stat{border:1px solid var(--line);background:#fff;border-radius:12px;height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.stat b{color:var(--fg)}
.weekbar{display:flex;align-items:center;gap:8px;margin:18px 0 6px;flex-wrap:wrap}
.sq{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:10px}
.wk{font-weight:800;font-size:16px;min-width:200px}
.tabs{display:flex;gap:10px;margin:14px 0 18px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 26px;font-weight:700;color:var(--mute);display:flex;gap:8px;align-items:center}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tab .n{font-size:11px;background:rgba(0,0,0,.08);border-radius:99px;padding:0 7px}
.tab.on .n{background:rgba(255,255,255,.25)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.team{padding:22px 26px}
.team h2{margin:0;font-size:20px;border-left:5px solid var(--brand);padding-left:12px;line-height:1.1}
.team .sub{margin:4px 0 0 17px;color:var(--mute);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fafbfa}
.kpi.hl{background:#eaf6f1;border-color:#bfe0d3}
.kpi small{color:var(--mute);font-size:12px}
.kpi b{display:block;font-size:30px;line-height:1.2;margin:4px 0}
.kpi em{font-style:normal;font-size:11.5px;color:var(--faint)}
.kpi.hl em{color:var(--brand);font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px}
.sec h3{margin:0;font-size:17px}.sec span{color:var(--mute);font-size:12.5px}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:800}
.status.draft{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line)}
.status.ok{background:var(--brand-soft);color:var(--brand)}
.item{margin-bottom:14px;overflow:hidden}
.ih{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.no{width:30px;height:30px;border-radius:9px;background:#eef2f0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mute);flex:none}
.it{min-width:0;flex:1}.it b{display:block;font-size:15.5px}.it small{color:var(--mute);font-size:12.5px}
.badge{border-radius:99px;padding:3px 12px;font-size:12px;font-weight:800;background:var(--brand-soft);color:var(--brand);flex:none}
.badge.sup{background:#f0eafa;color:#7447b8}
.cols{display:grid;grid-template-columns:1fr 1fr}
.col{padding:16px 22px 18px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.col h4{margin:0 0 8px;font-size:12px;color:var(--brand);font-weight:800}
.col ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.col li{display:flex;gap:9px;font-size:13.5px}
.col li::before{content:"✓";color:var(--brand);font-weight:800;flex:none}
.col.plan li::before{content:"→";color:var(--mute)}
.col .empty{color:var(--faint);font-size:12.5px}
.extra{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.ex{padding:12px 22px;font-size:13px;min-width:0}
.ex+.ex{border-left:1px solid var(--line)}
.ex h4{margin:0 0 4px;font-size:11.5px;font-weight:800}
.ex.need{background:#fffaf8}.ex.need h4{color:var(--need-fg)}
.ex.dec{background:#f8fbff}.ex.dec h4{color:var(--dec-fg)}
.ex .empty{color:var(--faint)}
.ex p{margin:0;white-space:pre-wrap}
textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical;background:#fff}
textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.hint{font-size:11.5px;color:var(--mute);margin-top:4px}
.warn{margin:0 0 14px;padding:9px 14px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);font-size:12.5px}
.empty-state{padding:60px 20px;text-align:center;color:var(--faint)}
.menu{position:absolute;right:0;top:50px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.14);min-width:300px;padding:6px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px}
.menu button:hover:not(:disabled){background:#f3f7f5}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu b{display:block;font-size:13.5px}.menu small{color:var(--mute);font-size:12px}
.rel{position:relative}
.mask{position:fixed;inset:0;background:rgba(20,32,28,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}
.mask.on{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:980px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:18px}.x{border:0;background:none;font-size:26px;color:var(--mute);line-height:1}
.mb{padding:18px 24px}.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;min-width:1100px;width:100%;font-size:12px}
th{background:#eef5f1;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-wrap;max-width:300px}
.steps{display:grid;gap:8px;margin-top:12px}
.step{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a26;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}.cols,.extra{grid-template-columns:1fr}
  .col+.col,.ex+.ex{border-left:0;border-top:1px solid var(--line)}
  h1{font-size:28px}
}
</style>
</head>
<body>
<div class="sim"><span>시뮬레이션 · 샘플 문구는 전사 주간업무보고 시트의 형식에 맞춘 예시입니다(이름 등 제거). 엑셀 저장은 실제 .xlsx 가 내려받아집니다.</span>

<div class="top"><div class="logo"><i>↗</i><div><b>주간 업무 보고</b><small>사업팀 통합 현황</small></div></div><span class="pill" id="range"></span></div>
<div class="wrap" id="root"></div>

<div class="mask" id="mask"><div class="modal" role="dialog" aria-modal="true"><div class="mh"><h2 id="mt"></h2><button class="x" id="mx" aria-label="닫기">×</button></div><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<div class="toast" id="toast"></div>

  var HEAD=['월','주차','시작일','종료일','팀','부문/실','담당자 (필요시)','No','프로젝트 이름 or 업무활동 (선택만 가능)','고객(사용자)','추진내역','추진계획','지원 필요사항','주요 의사결정 (주간업무보고 시간 의사결정 내역 기록)'];

  function fname(sfx){var wi=weekInfo(parse(S.week));return '전사주간업무보고_'+sfx+'_'+String(wi.year).slice(2)+p2(wi.month)+'_'+wi.n+'주차.xlsx';}
  function dl(wb,name){

    XLSX.writeFile(wb,name);toast('엑셀을 저장했습니다 · '+name);
  }
  function mkSheet(rows){
    var ws=XLSX.utils.aoa_to_sheet([HEAD].concat(rows));
    ws['!cols']=[{wch:5},{wch:5},{wch:13},{wch:13},{wch:12},{wch:8},{wch:10},{wch:5},{wch:42},{wch:18},{wch:60},{wch:60},{wch:36},{wch:36}];return ws;
  }
  function exportTeam(){

    var t=e.target.closest('[data-team]');if(t){S.team=t.dataset.team;S.edit=false;render();return;}
    if(e.target.id==='edit'){S.edit=!S.edit;render();if(!S.edit)toast('저장했습니다 · 작성 중');return;}
    if(e.target.id==='confirm'){data().status='ok';S.edit=false;render();toast('확정했습니다 · 이후 수정하면 「작성 중」으로 돌아갑니다');return;}
    if(e.target.id==='gen'){D[S.week+'|'+S.team]={status:'draft',kpi:[['정기점검','0건','—',1],['A/S 처리','0건','—'],['사업 업무','0건','—'],['영업·지원','0건','—']],rows:[{t:'(자동 집계 결과가 여기에 채워집니다)',done:[],plan:[]}]};render();return;}
  });
  document.addEventListener('input',function(e){
    var t=e.target;if(t.tagName!=='TEXTAREA'||!t.dataset.f)return;
    var r=data().rows[+t.dataset.i],f=t.dataset.f;
    if(f==='done'||f==='plan')r[f]=t.value.split('\n').filter(function(s){return s.trim();});else r[f]=t.value;
    if(data().status==='ok'&&(f==='done'||f==='plan'))data().status='draft';
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM();});
  document.addEventListener('input',function(e){var f=e.target.dataset&&e.target.dataset.p;if(!f)return;var d=data(),p=d.prog;p[f]=e.target.value;if(f==='done'||f==='total'){if(+p.total>0&&p.done!==''){p.pct=(Math.round(+p.done/+p.total*1000)/10)+'';var q=document.querySelector('[data-p=pct]');if(q)q.value=p.pct;}}
  var cyc=p.cycle,txt=(p.pct!==''?cyc+' · '+(p.total?'누적 '+p.done+'/'+p.total+' · ':'')+p.pct+'%':'진행율 미입력');d.kpi[0][2]=txt;var em=document.querySelector('.kpi.hl em');if(em)em.textContent=txt;});
  document.addEventListener('change',function(e){if(e.target.dataset&&e.target.dataset.p==='cycle'){data().prog.cycle=e.target.value;}});
  document.getElementById('role').addEventListener('change',function(e){S.role=e.target.value;S.edit=false;if(S.role!=='all')S.team='si';render();});
  render();
})();
</script>
</body>
</html>
